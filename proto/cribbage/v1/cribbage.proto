syntax = "proto3";

package cribbage.v1;

option csharp_namespace = "Cribbage.Protocol";
option go_package = "cribbage/internal/protocol/pb";

// Cards are encoded as suit*13 + (rank-1), giving 0..51.
// Suits: 0 clubs, 1 diamonds, 2 hearts, 3 spades. Ranks: 1 ace .. 13 king.
// Seats are 0 or 1; -1 means "none".

// ProtocolVersion is the version of this protocol. Clients send it in
// every ClientMessage; a server answers a message with any other version
// with UPGRADE_REQUIRED and closes the connection. Change CURRENT whenever
// a change would break clients built against the previous version.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 2;
}

// ---------------------------------------------------------------------------
// Client -> server
// ---------------------------------------------------------------------------

message ClientMessage {
  // Optional client-chosen id, echoed on the direct response or error.
  uint32 request_id = 1;
  // The ProtocolVersion the client was built for (PROTOCOL_VERSION_CURRENT
  // as a number).
  uint32 protocol_version = 2;
  oneof body {
    Register register = 10;
    RequestSignIn request_sign_in = 11;
    Resume resume = 12;
    Logout logout = 13;
    EnterCode enter_code = 14;
    UseSignInLink use_sign_in_link = 15;
    StartDeviceSignIn start_device_sign_in = 16;
    ClaimDeviceSignIn claim_device_sign_in = 17;
    PasskeySignInBegin passkey_sign_in_begin = 18;
    PasskeySignInFinish passkey_sign_in_finish = 19;
    BotLogin bot_login = 9;
    CreateGame create_game = 20;
    JoinGame join_game = 21;
    ListGames list_games = 22;
    FindMatch find_match = 23;
    CancelMatch cancel_match = 24;
    SyncGame sync_game = 25;
    SendInvite send_invite = 26;
    RespondInvite respond_invite = 27;
    RedeemCode redeem_code = 28;
    GetHistory get_history = 29;
    Act act = 30;
    Resign resign = 31;
    Ping ping = 40;
    SetEmail set_email = 51;
    VerifyEmail verify_email = 54;
    DeleteAccount delete_account = 55;
    ConfirmDeleteAccount confirm_delete_account = 56;
    SignOutOthers sign_out_others = 57;
    ApproveDevice approve_device = 58;
    PasskeyAddBegin passkey_add_begin = 59;
    PasskeyAddFinish passkey_add_finish = 60;
    PasskeyRemove passkey_remove = 61;
  }
  reserved 50, 52, 53; // password messages, removed
}

// There are no passwords. People sign in with a code mailed to them
// (RequestSignIn, EnterCode), the link in the same email (UseSignInLink),
// a passkey (PasskeySignIn...), or by approving a new device from one that
// is signed in (StartDeviceSignIn, ApproveDevice). Each ends in AuthOk,
// whose token signs the device in again later (Resume).

// Register starts creating an account: it mails a code (and link) to email,
// and the reply is SignInStarted. The account is created, signed in, when
// the code is entered (EnterCode) or the link opened (UseSignInLink).
// USERNAME_TAKEN if the username is in use, BAD_REQUEST if a field is
// invalid. Several accounts may share an address.
message Register {
  string username = 1;
  string nickname = 3;
  string email = 4;
  reserved 2;
}

// RequestSignIn mails a sign-in code and link to the account with this
// username, or to every account with this email address. The reply is
// SignInStarted whether or not any account matched, so it does not reveal
// who has one. A code asked for again within its lifetime is sent again,
// unchanged.
message RequestSignIn {
  string name = 1; // a username or an email address
}

// SignInStarted: enter the emailed code with this challenge (EnterCode).
message SignInStarted {
  string challenge = 1;
  uint32 code_length = 2; // digits in the code
  uint32 expires_in = 3; // seconds
}

// EnterCode finishes signing in (or registering) with the code from the
// email. The reply is AuthOk; INVALID_CREDENTIALS for a wrong code;
// NOT_FOUND once the challenge has expired or had too many wrong codes, or
// RATE_LIMITED after too many wrong codes for the account. If an address
// shared by several accounts was given, each account's code signs in that
// account.
message EnterCode {
  string challenge = 1;
  string code = 2;
}

// UseSignInLink signs in with the token from an emailed link (the web
// client's #signin=...). It signs in the device that opens the link, not
// the one that asked for it. The reply is AuthOk, or NOT_FOUND if the link
// has expired or was used.
message UseSignInLink {
  string token = 1;
}

// StartDeviceSignIn begins signing in by approval from another device: the
// reply is DeviceCode. Show its code and URL, and send ClaimDeviceSignIn;
// once a signed-in user approves the code (ApproveDevice), claim it again
// to be signed in as them.
message StartDeviceSignIn {}

message DeviceCode {
  string challenge = 1; // secret: for ClaimDeviceSignIn only
  string code = 2; // to show, e.g. "BCDF-GHJK"
  string url = 3; // where to approve it, with the code filled in
  uint32 expires_in = 4; // seconds
}

// ClaimDeviceSignIn signs in with an approved DeviceCode: the reply is
// AuthOk. Until it is approved the reply is Ack, and the server sends this
// connection DeviceApproved when it is; claim it again then. NOT_FOUND once
// it has expired (or was claimed). A connection waiting for approval is not
// closed for failing to sign in; after reconnecting, claim it again.
message ClaimDeviceSignIn {
  string challenge = 1;
}

// DeviceApproved: the DeviceCode this connection is waiting for was
// approved; send ClaimDeviceSignIn.
message DeviceApproved {}

// ApproveDevice signs in the device showing this code (DeviceCode.code;
// case, spaces and dashes are ignored) as the user. The reply is Ack, or
// NOT_FOUND for an unknown or expired code.
message ApproveDevice {
  string code = 1;
}

// Passkeys (WebAuthn), for clients that can use them; Account says whether
// the server offers them. The JSON is what the browser's WebAuthn API takes
// and returns (PublicKeyCredential.toJSON()).
//
// PasskeySignInBegin's reply is PasskeyOptions, for
// navigator.credentials.get(); PasskeySignInFinish sends the credential it
// returns, and the reply is AuthOk or INVALID_CREDENTIALS.
message PasskeySignInBegin {}

message PasskeySignInFinish {
  string credential_json = 1;
}

// PasskeyAddBegin's reply is PasskeyOptions, for
// navigator.credentials.create(); PasskeyAddFinish sends the new
// credential, and the reply is Account.
message PasskeyAddBegin {}

message PasskeyAddFinish {
  string credential_json = 1;
  string name = 2; // e.g. "iPhone"; may be empty
}

// PasskeyRemove removes one of the user's passkeys. The reply is Account.
message PasskeyRemove {
  string id = 1; // Passkey.id
}

message PasskeyOptions {
  string options_json = 1;
}

// BotLogin signs in a headless client (cmd/botclient) with the server's bot
// key, creating a bot account if there is none with this username. Bot
// accounts have no email address and cannot sign in otherwise; no other
// account can sign in this way. INVALID_CREDENTIALS if the key is wrong or
// the server has none.
message BotLogin {
  string username = 1;
  string nickname = 2; // for a new account; the username if empty
  string key = 3;
}

// Resume authenticates with a token from a previous AuthOk.
message Resume {
  string token = 1;
}

// Logout ends this connection's session: its token stops working. The
// server acknowledges, then closes the connection.
message Logout {}

message CreateGame {
  // Name of a server-side bot opponent ("random", "heuristic", or "nn" when
  // the server was started with a model). Empty
  // creates an open game that another player can join.
  string bot = 1;
}

message JoinGame {
  string game_id = 1;
}

message ListGames {}

// FindMatch queues for a game against any other user who is also queued.
// Each request yields one game, so a client may queue several at once.
message FindMatch {}

// CancelMatch removes all of this user's queued FindMatch requests.
message CancelMatch {}

// SendInvite invites a player, by username, to a game. With no username it
// makes an invite code instead, for the sender to pass on; whoever enters it
// with RedeemCode joins the game. Invites last 48 hours. The reply is
// Invites, or an error (NOT_FOUND for an unknown player, TOO_MANY_GAMES at
// a limit on invites).
message SendInvite {
  string username = 1;
}

// RespondInvite accepts or declines an invite to the user, or (accept
// false) cancels one from them. Accepting starts the game: the reply is its
// first GameUpdate.
message RespondInvite {
  string invite_id = 1;
  bool accept = 2;
}

// RedeemCode accepts the invite with this code ("ABC-DEF"; case, spaces and
// dashes are ignored). The reply is the game's first GameUpdate.
message RedeemCode {
  string code = 1;
}

// SyncGame requests a full GameUpdate for one game.
message SyncGame {
  string game_id = 1;
}

message Act {
  string game_id = 1;
  Action action = 2;
}

message Resign {
  string game_id = 1;
}

message Ping {
  uint64 client_time = 1;
}

// GetHistory asks for a page of the user's finished games, newest first.
// The first page also carries the user's record against each opponent.
// Open games that nobody joined are left out. The reply is History.
message GetHistory {
  string after = 1; // History.next from the previous page; empty for the first
  uint32 limit = 2; // games per page: 0 means 50, and at most 100
}

// SetEmail changes the address that sign-in codes go to. The server mails
// a link to the current address to confirm the change and, once that is
// opened, a link to the new address; the address changes when that one is
// opened (both links send VerifyEmail). Until then it is
// Account.pending_email. An account with no address (a bot) gets only the
// second link. The reply is Account.
message SetEmail {
  string email = 1;
  reserved 2;
}

// VerifyEmail confirms a step of an address change with the token from
// either SetEmail link (the web client's #change=... and #verify=...). The
// reply is Ack, and connections signed in as that user receive Account.
// NOT_FOUND if the link has expired or was used. Allowed before signing in.
message VerifyEmail {
  string token = 1;
}

// DeleteAccount starts deleting the user's account. The reply is Ack and a
// link is mailed to the account's address; the account is deleted only
// when ConfirmDeleteAccount sends the link's token. A bot account, which
// has no address, is deleted at once if username is its username: the
// reply is AccountDeleted, and the server closes every connection of the
// account.
//
// Deleting ends the user's unfinished games (resigning active ones), drops
// their invites, and removes the account. Finished games stay in their
// opponents' history, with the player shown as "Deleted player".
message DeleteAccount {
  string username = 2;
  reserved 1;
}

// ConfirmDeleteAccount deletes an account with the token from a
// DeleteAccount link. The reply is AccountDeleted. NOT_FOUND if the link
// has expired or was used. Allowed before signing in.
message ConfirmDeleteAccount {
  string token = 1;
}

// SignOutOthers ends every session of the user but this one and closes
// their other connections. The reply is Ack.
message SignOutOthers {}

// ---------------------------------------------------------------------------
// Server -> client
// ---------------------------------------------------------------------------

message ServerMessage {
  // The request_id of the client message this answers, or 0 if unsolicited.
  uint32 request_id = 1;
  oneof body {
    Error error = 10;
    AuthOk auth_ok = 11;
    GameList game_list = 20;
    GameUpdate game_update = 21;
    MatchQueued match_queued = 22;
    Ack ack = 23;
    Invites invites = 24; // the user's pending invites, whenever they change
    History history = 25;
    AccountDeleted account_deleted = 26;
    SignInStarted sign_in_started = 27;
    DeviceCode device_code = 28;
    PasskeyOptions passkey_options = 29;
    DeviceApproved device_approved = 30;
    Account account = 12; // the user's account settings, whenever they change
    Pong pong = 40;
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_BAD_REQUEST = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_ALREADY_AUTHENTICATED = 3;
  ERROR_CODE_USERNAME_TAKEN = 4;
  ERROR_CODE_INVALID_CREDENTIALS = 5;
  ERROR_CODE_NOT_FOUND = 6;
  ERROR_CODE_NOT_IN_GAME = 7;
  ERROR_CODE_ILLEGAL_ACTION = 8;
  ERROR_CODE_GAME_UNAVAILABLE = 9;
  ERROR_CODE_INTERNAL = 10;
  ERROR_CODE_RATE_LIMITED = 11; // too many attempts; try again later
  ERROR_CODE_TOO_MANY_GAMES = 12; // a player is at a limit on games or invites
  reserved 13; // PASSWORD_CHANGE_REQUIRED, removed
  // The client was built for another ProtocolVersion; the server closes
  // the connection after sending this.
  ERROR_CODE_UPGRADE_REQUIRED = 14;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  string game_id = 3;
}

message AuthOk {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  // Token for Resume on a later connection.
  string token = 4;
  Account account = 5;
}

// AccountDeleted: the account is gone, and the server closes every
// connection logged in as it.
message AccountDeleted {
  string username = 1;
}

// Account is what a user can see and change about their account.
message Account {
  string email = 1; // verified address for sign-in codes; empty for a bot
  string pending_email = 2; // asked for but not yet confirmed
  // The change of address waits for the link sent to the current address;
  // after that, for the one sent to pending_email.
  bool pending_needs_current = 7;
  bool passkeys_enabled = 5; // the server offers passkeys
  repeated Passkey passkeys = 6;
  reserved 3, 4;
}

message Passkey {
  string id = 1; // base64url credential ID
  string name = 2;
  int64 created = 3; // Unix ms
  int64 last_used = 4; // Unix ms; 0 if never
}

message MatchQueued {}

// Ack confirms a request that has no more specific reply (CancelMatch).
message Ack {}

message Pong {
  uint64 client_time = 1;
  uint64 server_time = 2;
}

enum GameStatus {
  GAME_STATUS_UNSPECIFIED = 0;
  GAME_STATUS_WAITING = 1; // open game waiting for a second player
  GAME_STATUS_ACTIVE = 2;
  GAME_STATUS_FINISHED = 3;
}

message PlayerInfo {
  int64 user_id = 1; // 0 for bots
  string nickname = 2;
  string bot = 3; // bot name for server-side bots, otherwise empty
  bool connected = 4;
}

message GameSummary {
  string game_id = 1;
  GameStatus status = 2;
  repeated PlayerInfo players = 3; // indexed by seat
  int32 seat = 4; // the receiving user's seat, or -1
  repeated int32 scores = 5;
  int32 winner = 6;
  bool your_turn = 7;
  bool resigned = 8; // the game ended by resignation
  int64 updated = 9; // Unix milliseconds of the last change; when a finished game ended
}

// Invite is a pending invitation to a game.
message Invite {
  string invite_id = 1;
  PlayerInfo from = 2;
  PlayerInfo to = 3; // unset for a code nobody has entered yet
  string code = 4; // only for the sender of a code invite
  int64 expires = 5; // Unix milliseconds
  bool incoming = 6; // the user is the one invited
}

message Invites {
  repeated Invite invites = 1;
}

// History is a page of a user's finished games.
message History {
  repeated GameSummary games = 1; // newest first
  string next = 2; // pass as GetHistory.after for the next page; empty at the end
  // First page only: the user's record against each opponent, most games
  // first, and in all.
  repeated Record records = 3;
  Record total = 4;
}

// Record counts a user's finished games against one opponent.
message Record {
  PlayerInfo opponent = 1; // a person (user_id and latest nickname) or a bot (bot)
  uint32 games = 2;
  uint32 wins = 3;
  uint32 losses = 4; // including resignations
  uint32 unfinished = 5; // expired or cancelled, so no winner
  int64 last = 6; // Unix milliseconds of the latest game
}

message GameList {
  repeated GameSummary mine = 1; // the user's waiting and active games
  repeated GameSummary open = 2; // other users' games waiting for a player
  // The user's most recently finished games, newest first. Lets a client
  // that was disconnected learn how a game ended.
  repeated GameSummary recent = 3;
  repeated Invite invites = 4; // pending invites to and from the user
}

// GameUpdate is sent to each player after every change to a game.
message GameUpdate {
  GameSummary game = 1;
  // Number of actions applied so far.
  uint32 seq = 2;
  // Absent while the game is waiting for a second player.
  Observation observation = 3;
  // Events since the previous update. Empty on a full sync.
  repeated Event events = 4;
  // Legal actions for the receiving player; empty if it is not their turn.
  repeated Action legal = 5;
  // True when sent in response to a sync or reconnect rather than a change.
  bool full = 6;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_DISCARD = 1;
  PHASE_PEGGING = 2;
  PHASE_GAME_OVER = 3;
}

message PlayedCard {
  uint32 card = 1;
  int32 seat = 2;
}

message Observation {
  int32 seat = 1;
  Phase phase = 2;
  int32 dealer = 3;
  int32 turn = 4; // -1 outside pegging
  bool must_act = 5;
  int32 hand_number = 6;
  repeated int32 scores = 7;
  int32 winner = 8;
  repeated uint32 hand = 9; // cards still held
  bool discarded = 10;
  bool opp_discarded = 11;
  repeated uint32 kept = 12; // the four kept cards, once discarded
  repeated uint32 discards = 13; // this player's two crib cards, once discarded
  optional uint32 starter = 14;
  int32 count = 15;
  repeated PlayedCard played = 16; // all cards played this hand
  int32 seq_start = 17; // played[seq_start:] is the current count
  int32 opp_hand_size = 18;
}

enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  ACTION_KIND_DISCARD = 1;
  ACTION_KIND_PLAY = 2;
}

message Action {
  ActionKind kind = 1;
  repeated uint32 cards = 2; // two cards for discard, one for play
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_CUT_FOR_DEAL = 1; // cards[0] cut by seat 0, cards[1] by seat 1
  EVENT_KIND_DEAL = 2; // seat deals
  EVENT_KIND_DISCARD = 3; // seat discarded (cards hidden)
  EVENT_KIND_STARTER = 4; // card is the starter; seat (dealer) scored points for his heels
  EVENT_KIND_PLAY = 5; // seat played card, count is the new count
  EVENT_KIND_GO = 6; // seat could not play
  EVENT_KIND_GO_POINT = 7;
  EVENT_KIND_LAST_CARD = 8;
  EVENT_KIND_COUNT_RESET = 9;
  EVENT_KIND_SHOW_HAND = 10; // cards is the hand, card the starter
  EVENT_KIND_SHOW_CRIB = 11;
  EVENT_KIND_GAME_OVER = 12; // seat won
  EVENT_KIND_RESIGN = 13; // seat resigned
  EVENT_KIND_EXPIRED = 14; // the game ended unfinished after a long time without a move
}

message PegScore {
  int32 fifteen = 1;
  int32 thirty_one = 2;
  int32 pairs = 3;
  int32 run = 4;
}

message ShowScore {
  int32 fifteens = 1;
  int32 pairs = 2;
  int32 runs = 3;
  int32 flush = 4;
  int32 nobs = 5;
}

message Event {
  EventKind kind = 1;
  int32 seat = 2;
  optional uint32 card = 3;
  repeated uint32 cards = 4;
  int32 count = 5;
  int32 points = 6;
  PegScore peg = 7;
  ShowScore show = 8;
  repeated int32 scores = 9; // scores after the event
  int32 skunk = 10;
}
