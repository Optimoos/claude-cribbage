# cribserver settings. Install as /etc/cribbage/cribserver.conf (see
# README.md). One "name = value" per line; names are the command-line flags
# without the dash (cribserver -help lists them all, and
# cribserver -print-config writes a file with every one). Flags given on
# the command line override this file. Restart the service after editing:
#   systemctl restart cribbage

# The server serves HTTPS itself (WebRTC signaling and /api, for the web
# page on Cloudflare Pages and the desktop app), with a Let's Encrypt
# certificate for tls-domain. It needs port 443, and the name's DNS pointing
# at this machine. The bot TCP port listens on localhost only.
http = :443
tls-domain = api.cribbage.example.com
tls-cache = /var/lib/cribbage/certs
tcp = 127.0.0.1:7777
rtc-port = 7778
rtc-public-only = true
# On clouds whose public IP is NATed (AWS, GCP, Azure):
# public-ip = 203.0.113.10

db = /var/lib/cribbage/cribbage.db
backup-dir = /var/lib/cribbage/backups
backup-every = 24h
backup-keep = 7
expert = /opt/cribbage/expert.bin
admin-socket = /run/cribbage/admin.sock
stats = 5m

# Where the clients' "Report a bug" links go.
report-url = https://github.com/Optimoos

# The address players use: the web page, on Cloudflare Pages. Links in
# emails point here, and passkeys are bound to its host name: changing it
# later makes everyone's passkeys stop working (they can sign in by email
# and add new ones).
public-url = https://cribbage.example.com

# Email (see README.md). There are no passwords: players sign in with
# codes sent here, so the server needs a mail account that can send from
# your domain. The secrets stay in their own files; systemd hands them to
# the server in ${CREDENTIALS_DIRECTORY} (the LoadCredential= lines in
# cribbage.service).
smtp = smtp.example.com:465
smtp-user = cribbage@example.com
smtp-password-file = ${CREDENTIALS_DIRECTORY}/smtp-password
email-key-file = ${CREDENTIALS_DIRECTORY}/email-key
mail-from = cribbage@example.com

# Headless bots (cmd/botclient) on this machine sign in with this key:
# create it like the others and add a LoadCredential= line for it.
# bot-key-file = ${CREDENTIALS_DIRECTORY}/bot-key
