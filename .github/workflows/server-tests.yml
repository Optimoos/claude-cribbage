# Runs the server's checks and the web client's browser tests on every push
# and pull request, so a broken rule, sign-in or emailed link is seen before
# anyone builds a server or a page from it.
name: Server tests

on:
  push:
    paths: ["server/**", "proto/**", ".github/workflows/server-tests.yml"]
  pull_request:
    paths: ["server/**", "proto/**", ".github/workflows/server-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test ./...

  # The web client against a real server in headless Chromium.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server/web/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: server/web/test/test-results/
